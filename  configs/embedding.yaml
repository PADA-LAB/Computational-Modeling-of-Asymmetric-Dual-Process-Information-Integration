experiment:
  text_column: "Review_Text"
  label_column: "binary_helpfulness"
  seeds: [3, 42, 80]
  n_trials: 10
  embedding_models:
    - "sentence-transformers/all-mpnet-base-v2"
    - "bert-base-uncased"
    - "roberta-base"
    - "distilbert-base-uncased"
    - "t5-base"
  s2_models: ["mlp", "xgb", "cat", "lgbm"]
  batch_size: 32

data:
  Amazon: "data/amazon/amazon.csv"
  Hotel: "data/hotel/hotel.csv"
  Coursera: "data/coursera/coursera.csv"
  Audible: "data/audible/audible.csv"

output:
  root_dir: "outputs/embedding_comparison"